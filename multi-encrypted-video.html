<html>

<head>
  <title>Multi Encrypted Video</title>
  <!-- <link rel="stylesheet" href="base.css" title="base"  id="sheetSwap"> -->
  <style id="base">
    body {
      margin: 0;
    }

    #primary-player-layer {
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
    }

    #secondary-player-layer {
      position: absolute;
      top: 60%;
      height: 40%;
      width: 100%;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .item {
      width: 426px;
      height: 240px;
      display: inline-block;
      margin: 24px;
      vertical-align: middle;
      background-color: rgba(33, 33, 33, .75);
    }
  </style>
  <style id="mosaic" media="max-width: 1px">
    body {
      margin: 0;
      /* background-color: #3d3d3d; */
    }

    #container {
      /* display: grid;
      grid-template-rows: repeat(2, 1fr);
      grid-template-columns: repeat(2, 1fr); */
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #pv {
      /* display: flex; */
      justify-content: center;
      align-items: center;
      /* outline-style: solid; */
      /* outline-color: green; */
      /* grid-column: 1; */
      box-sizing: border-box;
      padding: 10px;
      width: 50%;
      height: 50%;
      float: left;
    }

    #sv1 {
      /* display: flex; */
      justify-content: center;
      align-items: center;
      /* outline-style: solid; */
      /* outline-color: red; */
      /* grid-column: 2; */
      box-sizing: border-box;
      padding: 10px;
      width: 50%;
      height: 50%;
      float: left;
    }

    #sv2 {
      /* display: flex; */
      justify-content: center;
      align-items: center;
      /* outline-style: solid; */
      /* outline-color: blue; */
      /* grid-column: 1; */
      box-sizing: border-box;
      padding: 10px;
      width: 50%;
      height: 50%;
      float: left;
    }

    #sv3 {
      /* display: flex; */
      justify-content: center;
      align-items: center;
      /* outline-style: solid; */
      /* outline-color: orange; */
      /* grid-column: 2; */
      box-sizing: border-box;
      padding: 10px;
      width: 50%;
      height: 50%;
      float: left;
    }

    video {
      width: 95%;
      height: 95%;
    }
  </style>

</head>

<body>
  <div id="container">
    <div id="primary-player-layer">
      <div id="pv">
        <video id="primary-video" muted="1" autoplay="1" loop></video>
      </div>
    </div>
    <div id="secondary-player-layer">
      <div class="item" id="sv1">
        <video id="secondary-video-1" muted="1" autoplay="1" loop></video>
      </div>
      <div class="item" id="sv2">
        <video id="secondary-video-2" muted="1" autoplay="1" loop></video>
      </div>
      <div class="item" id="sv3">
        <video id="secondary-video-3" muted="1" autoplay="1" loop></video>
      </div>
    </div>
  </div>
  <script src="multi-encrypted-video.js"></script>
</body>

</html>
