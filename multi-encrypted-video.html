<html>

<head>
  <title>Multi Encrypted Video</title>
  <link rel="stylesheet" href="base.css" title="base"  id="sheetSwap">

</head>

<body>
  <div id="container">
    <div id="primary-player-layer">
      <div id="pv">
        <video id="primary-video" muted="1" autoplay="1" loop></video>
      </div>
    </div>
    <div id="secondary-player-layer">
      <div class="item" id="sv1">
        <video id="secondary-video-1" muted="1" autoplay="1" loop></video>
      </div>
      <div class="item" id="sv2">
        <video id="secondary-video-2" muted="1" autoplay="1" loop></video>
      </div>
      <div class="item" id="sv3">
        <video id="secondary-video-3" muted="1" autoplay="1" loop></video>
      </div>
    </div>
  </div>
  <script src="multi-encrypted-video.js"></script>
</body>

</html>
