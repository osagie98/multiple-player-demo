<html>

<head>
  <title>Multi Encrypted Video</title>
  <style id="base">
    #primary-player-layer {
      width: 100%;
      height: 100%;
    }

    video {
      width: 100%;
      height: 100%;
    }

    #secondary-player-layer {
      position: absolute;
      top: 60%;
      height: 40%;
      width: 100%;
      /* padding: 24px; */
      display: flex;
      justify-content: center;
    }

    .item {
      width: 24vw;
      height: auto;
      display: inline-block;
      margin: 24px;
      vertical-align: middle;
      padding: 0;
      background-color: rgba(33, 33, 33, 0);
    }
  </style>
  <style id="mosaic" media="max-width: 1px">
    #container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* margin: 0; */
      /* padding: 0; */
    }

    #pv {
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      width: 48%;
      height: 48%;
      float: left;
      padding: 0;
      margin-left: 2%;
      margin-right: 0%;
      margin-top: 1.3%;
    }

    #sv1 {
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      width: 48%;
      height: 48%;
      float: right;
      padding: 0;
      overflow: hidden;
      margin-left: 0%;
      margin-right: 2%;
      margin-top: 1.3%;
    }

    #sv2 {
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      width: 48%;
      height: 48%;
      float: left;
      padding: 0;
      margin-left: 2%;
      margin-right: 0%;
      margin-top: 2.5%;
    }

    #sv3 {
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      width: 48%;
      height: 48%;
      float: right;
      padding: 0;
      margin-left: 0%;
      margin-right: 2%;
      margin-top: 2.5%;
    }

    video {
      width: 100%;
      height: 100%;
    }
  </style>
  <style>
    body {
      margin: 0;
      background-color: rgb(39, 39, 39);
      height: 95vh;
    }
  </style>

</head>

<body>
  <div id="container">
    <div id="primary-player-layer">
      <div id="pv">
        <video id="primary-video" muted="1" autoplay="1" loop></video>
      </div>
    </div>
    <div id="secondary-player-layer">
      <div class="item" id="sv1">
        <video id="secondary-video-1" muted="1" autoplay="1" loop></video>
      </div>
      <div class="item" id="sv2">
        <video id="secondary-video-2" muted="1" autoplay="1" loop></video>
      </div>
      <div class="item" id="sv3">
        <video id="secondary-video-3" muted="1" autoplay="1" loop></video>
      </div>
    </div>
  </div>
  <script src="multi-encrypted-video.js"></script>
</body>

</html>
